<title>BCGO Career Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a transit map. Picker on top ("where you stand"), lines on the left, the selected route's ticket on the right. */
:root{
  --bg:#F7F5F0; --surface:#FFFFFF; --ink:#1E2633; --muted:#5B6474; --rule:#E3DED4; --accent:#1446A0; --brand:#0E2A5C; --green:#0B6B3A; --flagred:#D62828; --gold:#C9962B; --signal:#E2A21C; --signal-ink:#3A2700;
  --ok:#137A4C; --warn:#A86700; --bad:#B23A2E; --info:#1E5AA0;
  --l-gov:#0A6B4B; --l-bank:#1E5AA0; --l-it:#6E45C0; --l-eng:#C0442C; --l-health:#0C8585; --l-rmg:#C77200; --l-ngo:#5F8420; --l-mkt:#B9347F; --l-edu:#8A6526; --l-media:#41566B; --l-law:#7C1F2C; --l-agri:#3B8634; --l-def:#2F4A7A; --l-fmcg:#A33E8E; --l-scm:#356D8C; --l-tel:#5248B5;
  --f-disp:"Inter","Noto Sans Bengali",system-ui,sans-serif; --f-body:"Inter","Noto Sans Bengali",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B111C; --surface:#131C2B; --ink:#E6ECF5; --muted:#9AA7BC; --rule:#26324A; --accent:#7FA9F5; --brand:#B4CBF5; --green:#4FC283; --flagred:#F06A6A; --gold:#E3B95A; --signal:#F2B83A; --signal-ink:#2A1C00;
  --ok:#4CC88C; --warn:#F0B347; --bad:#F07A6C; --info:#6FA8F0;
  --l-gov:#3FB688; --l-bank:#5D9BEA; --l-it:#A587EA; --l-eng:#EE7A60; --l-health:#3CC0C0; --l-rmg:#F0A23A; --l-ngo:#9CC358; --l-mkt:#EC72B6; --l-edu:#D0A562; --l-media:#8FA7C0; --l-law:#E0707F; --l-agri:#78C46E; --l-def:#8EA6D8; --l-fmcg:#E07CCB; --l-scm:#79B6D6; --l-tel:#9C93F0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B111C; --surface:#131C2B; --ink:#E6ECF5; --muted:#9AA7BC; --rule:#26324A; --accent:#7FA9F5; --brand:#B4CBF5; --green:#4FC283; --flagred:#F06A6A; --gold:#E3B95A; --signal:#F2B83A; --signal-ink:#2A1C00;
  --ok:#4CC88C; --warn:#F0B347; --bad:#F07A6C; --info:#6FA8F0;
  --l-gov:#3FB688; --l-bank:#5D9BEA; --l-it:#A587EA; --l-eng:#EE7A60; --l-health:#3CC0C0; --l-rmg:#F0A23A; --l-ngo:#9CC358; --l-mkt:#EC72B6; --l-edu:#D0A562; --l-media:#8FA7C0; --l-law:#E0707F; --l-agri:#78C46E; --l-def:#8EA6D8; --l-fmcg:#E07CCB; --l-scm:#79B6D6; --l-tel:#9C93F0; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.7 var(--f-body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1200px;margin:0 auto}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-disp);line-height:1.2;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:1.15rem;letter-spacing:.01em}
.brand{text-decoration:none;color:inherit;min-width:0}
.logo{width:44px;height:44px;flex:none;display:block}
.logo .lg-bg{fill:var(--green)} .logo .lg-ring{stroke:#fff;opacity:.35} .logo .lg-orbit{stroke:var(--gold)} .logo .lg-red{fill:var(--flagred)} .logo .lg-dot{fill:var(--gold)}
.wm{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.wm b{font-family:"Inter",var(--f-disp);font-weight:800;font-size:1.08rem;letter-spacing:-.005em}
.wm-bc{color:var(--brand)} .wm-go{color:var(--green)}
.wm>span{font-size:.76rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.topr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.join{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:var(--surface);text-decoration:none;font-weight:600;font-size:.88rem;padding:7px 14px;border-radius:999px}
.join:hover{filter:brightness(1.12)}
.tagline{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.85rem;font-weight:600;color:var(--brand)}
.tagline span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:middle}
.brand small{font-weight:500;color:var(--muted);font-size:.85rem}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;padding:4px 14px;border-radius:999px;cursor:pointer;font-size:.9rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:32px;align-items:end;padding-block:20px 20px}
.hero h1{font-size:clamp(1.8rem,4.2vw,3.1rem);font-weight:800;letter-spacing:-.01em}
.hero p{max-width:62ch;color:var(--muted);margin:14px 0 0}
.stat{border-left:4px solid var(--signal);padding:4px 0 4px 16px}
.stat b{display:block;font-family:var(--f-mono);font-size:2.4rem;font-weight:500;line-height:1;color:var(--ink)}
.stat span{display:block;color:var(--muted);font-size:.92rem;margin-top:6px}
.stat a{font-size:.8rem}

/* picker */
.picker{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:24px}
.picker h2{font-size:1.15rem;grid-column:1/-1;display:flex;align-items:center;gap:10px}
.picker h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 30%,transparent)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld+ .fld{margin-top:14px}
label,.lbl{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
select,input[type=number]{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;min-width:0}
input[type=number]{font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chips.opt .chip{font-size:.82rem}
.gpa{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.gpa label{grid-column:1/-1}
.grade{font-size:.78rem;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.g1{color:var(--ok)}.g2{color:var(--info)}.g3{color:var(--warn)}.g0{color:var(--bad)}
.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.warnline{color:var(--warn)}

/* map */
.section{margin-top:40px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.sh h2{font-size:1.6rem;font-weight:800}
.sh p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;font-size:.88rem}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools label{display:flex;gap:6px;align-items:center;font-weight:500;color:var(--ink);font-size:.88rem}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.grp-h{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-size:1rem}
.grp-h:first-child{margin-top:0}
.cnt{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-weight:400}
.line{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px 6px;margin-bottom:8px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.line:hover{border-color:var(--lc)}
.line.on{border-color:var(--lc);box-shadow:inset 4px 0 0 var(--lc)}
.lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.lh .ln{font-family:var(--f-disp);font-weight:650;font-size:1rem;color:var(--ink)}
.lh .pay{margin-left:auto;font-family:var(--f-mono);color:var(--ink);font-size:.8rem}
.lh .miss{color:var(--warn)}
.sw{width:10px;height:10px;border-radius:2px;background:var(--lc);display:inline-block;flex:none}
.track{display:flex;overflow-x:auto;padding:10px 0 6px;scrollbar-width:thin}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;flex:1 0 120px;min-width:120px;text-align:center;padding:0 4px}
.stop::before{content:"";position:absolute;top:8px;right:50%;width:100%;height:5px;background:var(--lc);opacity:.35;transition:opacity .3s}
.stop:first-child::before{display:none}
.dot{width:21px;height:21px;border-radius:50%;border:5px solid var(--lc);background:var(--surface);position:relative;z-index:1;transition:background .3s}
.stop.origin .dot{background:var(--signal);border-color:var(--signal-ink)}
.stop.entry .dot{border-width:6px}
.sl{margin-top:6px;font-size:.84rem;line-height:1.3;font-weight:500}
.stop.entry .sl{font-weight:600}
.ss{font-size:.74rem;color:var(--muted);line-height:1.25}
.line.on .stop::before{opacity:1}
.line.on .stop:not(.origin) .dot{background:var(--lc)}
.line.on .stop:nth-child(2)::before,.line.on .stop:nth-child(2) .dot{transition-delay:.05s}
.line.on .stop:nth-child(3)::before,.line.on .stop:nth-child(3) .dot{transition-delay:.2s}
.line.on .stop:nth-child(4)::before,.line.on .stop:nth-child(4) .dot{transition-delay:.35s}

/* mind map */
.tree{display:flex;align-items:center;overflow-x:auto;padding:12px 4px 20px;scrollbar-width:thin}
.tree ul{list-style:none;margin:0;padding:0 0 0 26px;position:relative}
.tree ul::before{content:"";position:absolute;left:0;top:50%;width:26px;border-top:2px solid var(--rule)}
.tree li{position:relative;display:flex;align-items:center;padding:4px 0 4px 22px}
.tree li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--rule)}
.tree li:first-child::before{top:50%}
.tree li:last-child::before{bottom:50%}
.tree li:only-child::before{display:none}
.tree li::after{content:"";position:absolute;left:0;top:50%;width:22px;border-top:2px solid var(--rule)}
.tree li.path > ul::before,.tree li.lad::before,.tree li.lad::after,.tree li.lad > ul::before{border-color:var(--lc)}
.tree li.path::after{border-color:var(--lc);border-top-width:3px}
.node{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:7px 11px;max-width:212px;font-size:.86rem;line-height:1.3;text-align:left;cursor:pointer;flex:none;display:flex;flex-direction:column;gap:2px}
.node.root{background:var(--signal);color:var(--signal-ink);border:0;border-radius:16px;padding:12px 16px;font-family:var(--f-disp);font-weight:800;font-size:1.1rem;cursor:default;max-width:160px}
.node.root small{font-family:var(--f-body);font-weight:500;font-size:.78rem;opacity:.85}
.node.br{flex-direction:row;align-items:center;gap:8px;font-weight:600;color:var(--surface);border:0;border-radius:999px;padding:6px 12px;white-space:nowrap}
.b-direct,.b-ready{background:var(--ok)}.b-open,.b-anyg{background:var(--info)}.b-cond,.b-bridge,.b-missing{background:var(--warn)}.b-gpa{background:var(--bad)}
.nc{font-family:var(--f-mono);font-size:.74rem;background:color-mix(in srgb,var(--surface) 25%,transparent);border-radius:999px;padding:0 7px}
.car{font-family:var(--f-mono);opacity:.9}
.node.role{border-left:5px solid var(--lc)}
.node.role:hover{border-color:var(--lc)}
.node.role.on{border-color:var(--lc);box-shadow:0 0 0 2px var(--lc)}
.nt{font-weight:600}
.np{font-size:.74rem;color:var(--muted)}
.np.miss{color:var(--warn)}
.node.lad{border:2px solid var(--lc);background:color-mix(in srgb,var(--lc) 10%,var(--surface));font-weight:500;cursor:default;animation:unfold .35s ease-out both;animation-delay:var(--d,0ms)}
button.node.lad{cursor:pointer}
@keyframes unfold{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* quiz */
.lead{color:var(--muted);margin:6px 0 4px}
.qbar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:12px}
.qbar span{display:block;height:100%;background:var(--signal);transition:width .3s}
.qn{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin:10px 0 2px}
.qq{font-size:1.25rem;font-weight:650;margin-bottom:12px}
.qopts{display:grid;gap:8px}
.qopt{text-align:left;border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:11px 14px;cursor:pointer;font-size:.95rem}
.qopt:hover{border-color:var(--accent)}
.qopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.qres{margin:8px 0 14px}
.chip.static{cursor:default;background:var(--surface)}
.fit{display:block;width:100%;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.fit span{display:block;height:100%;background:var(--lc)}

/* action plan */
.plan{list-style:none;margin:6px 0 0;padding:0;border-left:3px solid var(--lc,var(--accent));}
.plan>li{position:relative;padding:0 0 12px 16px}
.plan>li::before{content:"";position:absolute;left:-8px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--lc,var(--accent))}
.plan>li:first-child::before{background:var(--signal);border-color:var(--signal)}
.pl{font-weight:700;font-size:.88rem}
.plan ul{margin:4px 0 0;padding-left:18px;font-size:.9rem}
.plan ul li{margin-bottom:3px}
.planb{font-size:.9rem;margin-top:6px}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
/* private industry list */
.indgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:14px}
.ind h3{font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ichips{display:flex;flex-wrap:wrap;gap:6px}
.ichip{border:1px solid var(--rule);border-left:4px solid var(--lc);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:.84rem;text-align:left;cursor:pointer}
.ichip:hover{border-color:var(--lc)}
.ichip.s-blocked{opacity:.45}
.ichip.s-direct{box-shadow:inset 0 -2px 0 var(--ok)}
.mkt{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.mk-sal{font-size:1.15rem;margin:0}
.mk-n{font-size:.8rem;margin:2px 0 6px}
.joinbox{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:#0E2A5C;color:#fff;border-radius:16px;padding:24px 28px}
.joinbox h2{font-size:1.4rem;font-weight:800;color:#fff}
.joinbox p{margin:6px 0 0;opacity:.85;max-width:60ch}
.join.big{background:var(--gold);color:#0E2A5C;font-size:1rem;padding:12px 22px}
/* pills */
.pill{display:inline-block;font-family:var(--f-body);font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;color:var(--surface);white-space:nowrap}
.p-direct,.p-ready{background:var(--ok)}.p-open,.p-anyg{background:var(--info)}.p-bridge,.p-cond,.p-missing{background:var(--warn)}.p-gpa,.p-blocked{background:var(--bad)}.p-na{display:none}

/* detail ticket */
#detail-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.ticket{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:20px;max-height:calc(100vh - 40px);overflow:auto}
.d-sec{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.d-title{font-size:1.4rem;font-weight:800;margin:6px 0 12px}
.ticket h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 4px;font-family:var(--f-body);font-weight:600}
.ticket p{margin:4px 0}
.verdict{border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--rule)}
.verdict p{margin:6px 0 0;font-size:.92rem}
.v-direct,.v-ready{border-color:var(--ok)}.v-open,.v-anyg{border-color:var(--info)}.v-bridge,.v-cond,.v-missing{border-color:var(--warn)}.v-gpa,.v-blocked{border-color:var(--bad)}
.verdict.big p{font-size:1rem}
.d-route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px;font-size:.85rem}
.d-route span{border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
.d-route span.me{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.d-route i{width:14px;height:3px;background:var(--lc,var(--accent));border-radius:2px}
.sk{margin:4px 0;padding-left:18px}
.src{display:block;font-size:.76rem;color:var(--muted);margin-top:4px}
.res.ok{color:var(--ok);font-weight:600}.res.no{color:var(--bad);font-weight:600}
.btn{margin-top:16px;border:0;background:var(--accent);color:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:none;border:1px solid var(--accent);color:var(--accent)}

/* two-up sections */
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:20px;min-width:0}
.panel h2{font-size:1.3rem;font-weight:800}
.panel>p{color:var(--muted);margin:6px 0 14px}
#check-out{margin-top:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:16px}
.card{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--lc);border-radius:var(--r);padding:12px;cursor:pointer}
.card strong{font-family:var(--f-disp);font-weight:650;line-height:1.25}
.card .muted{font-size:.8rem}
.prefrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:12px}
.orow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 2px;cursor:pointer}
.orow:last-child{border-bottom:0}
.orow .on{flex:1;min-width:0;font-weight:500}
.orow small{display:block;color:var(--muted);font-weight:400}
.orow .pay{font-family:var(--f-mono);font-size:.82rem;white-space:nowrap}
.gt{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin-top:6px}
caption{text-align:left;font-weight:600;font-size:.9rem;padding-bottom:4px}
td{border-top:1px solid var(--rule);padding:7px 4px;font-size:.92rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
#grades{display:grid;gap:16px}
#src-list{columns:2;column-gap:32px;padding-left:18px;font-size:.88rem}
#src-list li{break-inside:avoid;margin-bottom:6px}
.disc{color:var(--muted);max-width:80ch}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.85rem;color:var(--muted)}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr);gap:20px}
  .picker{grid-template-columns:minmax(0,1fr)}
  .mapgrid{grid-template-columns:minmax(0,1fr)}
  #detail-wrap{position:static}
  .ticket{max-height:none}
